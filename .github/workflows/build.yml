name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  mod:
    name: Build cheat DLL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Fetch MelonLoader reference DLLs
        run: bash scripts/fetch-refs.sh

      - name: Build
        run: dotnet build src/SchoolboyRunawayCheats.csproj -c Release -nologo

      - name: Upload mod DLL
        uses: actions/upload-artifact@v4
        with:
          name: SchoolboyRunawayCheats
          path: src/bin/Release/SchoolboyRunawayCheats.dll

  trainer:
    name: Build trainer exe
    runs-on: windows-latest
    needs: mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Download cheat DLL artifact
        uses: actions/download-artifact@v4
        with:
          name: SchoolboyRunawayCheats
          path: trainer-assets

      - name: Publish trainer (single-file self-contained win-x64)
        shell: pwsh
        run: |
          dotnet publish trainer/SchoolboyRunawayTrainer.csproj -c Release -r win-x64 --self-contained true `
            /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

      - name: Bundle cheat DLL next to exe
        shell: pwsh
        run: |
          Copy-Item trainer-assets\SchoolboyRunawayCheats.dll publish\ -Force
          Get-ChildItem publish | Format-Table Name, Length

      - name: Upload trainer bundle
        uses: actions/upload-artifact@v4
        with:
          name: SchoolboyRunawayTrainer-win-x64
          path: |
            publish/SchoolboyRunawayTrainer.exe
            publish/SchoolboyRunawayCheats.dll
